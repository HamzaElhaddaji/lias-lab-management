name: Verify application
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: lias-backend/pom.xml
      - run: chmod +x lias-backend/mvnw && cd lias-backend && ./mvnw -B -ntp verify
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lias-frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: lias-frontend
