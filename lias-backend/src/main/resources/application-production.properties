spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
app.jwt.secret=${APP_JWT_SECRET}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.seed.enabled=${SEED_DEMO_DATA:false}
app.seed.sample-data=${SEED_SAMPLE_DATA:false}
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
app.upload.dir=${UPLOAD_DIR:/app/uploads}
app.lab.creation-date=${LAB_CREATION_DATE:}
spring.jpa.show-sql=false
server.error.include-message=never
