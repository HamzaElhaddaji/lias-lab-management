# Local defaults only. The production profile requires environment secrets.
server.port=${PORT:${SERVER_PORT:8080}}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lias_db}
spring.datasource.username=${DB_USERNAME:lias_user}
spring.datasource.password=${DB_PASSWORD:lias_password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
app.jwt.secret=${APP_JWT_SECRET:lias_development_only_secret_change_before_deployment_1234567890}
app.jwt.expiration=${APP_JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.seed.enabled=${SEED_DEMO_DATA:true}
app.seed.sample-data=${SEED_SAMPLE_DATA:false}
app.seed.password=${SEED_PASSWORD:FriendDemo2026!}
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true
app.lab.creation-date=${LAB_CREATION_DATE:}
