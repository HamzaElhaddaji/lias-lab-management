spring.datasource.url=jdbc:h2:mem:preview;NON_KEYWORDS=YEAR,CONDITION,READ;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.seed.enabled=true
app.seed.sample-data=true
app.mail.enabled=false
app.upload.dir=target/preview-uploads
server.port=8080
app.cors.allowed-origins=http://127.0.0.1:5174,http://localhost:5174
